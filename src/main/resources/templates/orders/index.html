<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Đơn hàng của tôi')}"></head><body><div th:replace="~{fragments/layout :: header}"></div><main><section class="page-width content-page"><div class="catalog-heading"><div><span class="eyebrow">LỊCH SỬ MUA SẮM</span><h1>Đơn hàng của tôi</h1></div></div><div th:if="${orders.isEmpty()}" class="empty-state"><i class="fa-solid fa-box-open"></i><h2>Bạn chưa có đơn hàng nào</h2><a class="button button-dark" th:href="@{/products}">Khám phá sản phẩm</a></div><div th:unless="${orders.isEmpty()}" class="table-wrap"><table class="data-table"><thead><tr><th>Mã đơn</th><th>Ngày đặt</th><th>Số lượng</th><th>Tổng tiền</th><th>Trạng thái</th><th></th></tr></thead><tbody><tr th:each="order : ${orders}"><td th:text="${'#MS-' + #numbers.formatInteger(order.id,5)}"></td><td th:text="${#temporals.format(order.orderDate,'dd/MM/yyyy')}"></td><td th:text="${order.items.size()}"></td><td th:text="${#numbers.formatDecimal(order.totalAmount,0,'COMMA',0,'POINT') + ' đ'}"></td><td><span class="status-pill" th:text="${order.status.vietnamese()}"></span></td><td><a class="text-link" th:href="@{/orders/{id}(id=${order.id})}">Chi tiết</a></td></tr></tbody></table></div></section></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
