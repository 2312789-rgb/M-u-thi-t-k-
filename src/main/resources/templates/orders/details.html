<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Chi tiết đơn hàng')}"></head><body><div th:replace="~{fragments/layout :: header}"></div><main><section class="page-width content-page"><div class="catalog-heading"><div><span class="eyebrow" th:text="${'#MS-' + #numbers.formatInteger(order.id,5)}"></span><h1>Chi tiết đơn hàng</h1></div><span class="status-pill" th:text="${order.status.vietnamese()}"></span></div><div class="order-detail-grid"><div class="cart-lines"><div class="cart-line" th:each="item : ${order.items}"><div class="cart-item"><img th:src="${item.product.imageUrl}" alt=""><span><b th:text="${item.product.name}"></b><small th:text="${'Số lượng: ' + item.quantity}"></small></span></div><strong th:text="${#numbers.formatDecimal(item.subTotal,0,'COMMA',0,'POINT') + ' đ'}"></strong></div></div><aside class="order-summary"><span class="eyebrow">GIAO ĐẾN</span><b th:text="${order.recipientName}"></b><p th:text="${order.shippingAddress}"></p><p th:text="${order.phone}"></p><div class="summary-total"><b>Tổng cộng</b><strong th:text="${#numbers.formatDecimal(order.totalAmount,0,'COMMA',0,'POINT') + ' đ'}"></strong></div></aside></div></section></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
