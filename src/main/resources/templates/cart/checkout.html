<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Thanh toán')}"></head><body><div th:replace="~{fragments/layout :: header}"></div><main><section class="page-width content-page"><div class="catalog-heading"><div><span class="eyebrow">CHỈ CÒN MỘT BƯỚC</span><h1>Thông tin giao hàng</h1></div></div><form class="checkout-layout" th:action="@{/cart/checkout}" th:object="${form}" method="post"><div class="form-panel"><div class="validation-summary" th:if="${#fields.hasErrors()}">Vui lòng kiểm tra lại thông tin.</div><label>Người nhận</label><input th:field="*{recipientName}"><span th:errors="*{recipientName}"></span><label>Số điện thoại</label><input th:field="*{phone}"><span th:errors="*{phone}"></span><label>Địa chỉ giao hàng</label><textarea th:field="*{address}" rows="3"></textarea><span th:errors="*{address}"></span><label>Phương thức thanh toán</label><div class="payment-options"><label><input type="radio" th:field="*{paymentMethod}" value="COD"><span><b>Thanh toán khi nhận hàng</b><small>COD · trả tiền mặt</small></span></label><label><input type="radio" th:field="*{paymentMethod}" value="BANK_TRANSFER"><span><b>Chuyển khoản</b><small>Hướng dẫn sau khi đặt</small></span></label></div><label>Ghi chú</label><textarea th:field="*{note}" rows="2"></textarea><button class="button button-dark button-block">Xác nhận đặt hàng <i class="fa-solid fa-arrow-right"></i></button></div><aside class="order-summary"><span class="eyebrow">ĐƠN HÀNG CỦA BẠN</span><div class="checkout-item" th:each="item : ${cart}"><img th:src="${item.imageUrl()}" alt=""><span th:text="${item.productName() + ' × ' + item.quantity()}"></span><b th:text="${#numbers.formatDecimal(item.subtotal(),0,'COMMA',0,'POINT') + ' đ'}"></b></div><div class="summary-total"><b>Tổng cộng</b><strong th:text="${#numbers.formatDecimal(total,0,'COMMA',0,'POINT') + ' đ'}"></strong></div></aside></form></section></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
