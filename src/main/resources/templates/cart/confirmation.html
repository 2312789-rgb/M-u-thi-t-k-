<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Đặt hàng thành công')}"></head><body><div th:replace="~{fragments/layout :: header}"></div><main><section class="page-width confirmation-page"><div class="confirmation-mark"><i class="fa-solid fa-check"></i></div><span class="eyebrow">CẢM ƠN BẠN ĐÃ CHỌN MẶC STUDIO</span><h1>Đơn hàng đã được ghi nhận.</h1><p>Mã đơn <strong th:text="${'#MS-' + #numbers.formatInteger(order.id, 5)}"></strong></p><div class="notice-box" th:text="${paymentInstructions}"></div><div class="confirmation-meta"><span>Người nhận<b th:text="${order.recipientName}"></b></span><span>Địa chỉ<b th:text="${order.shippingAddress}"></b></span><span>Tổng thanh toán<b th:text="${#numbers.formatDecimal(order.totalAmount,0,'COMMA',0,'POINT') + ' đ'}"></b></span></div><a class="button button-dark" th:href="@{/orders}">Theo dõi đơn hàng</a></section></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
