<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Chat hỗ trợ')}"></head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<main class="page-width chat-page">
    <div class="catalog-heading">
        <div><span class="eyebrow">HỖ TRỢ KHÁCH HÀNG</span><h1 th:text="${currentRole == 'ROLE_ADMIN' ? 'Trò chuyện với ' + customerName : 'Chat với Mặc Studio'}">Chat hỗ trợ</h1></div>
        <a class="text-link" sec:authorize="hasRole('ADMIN')" th:href="@{/chat}"><i class="fa-solid fa-arrow-left"></i> Danh sách tin nhắn</a>
    </div>
    <div class="chat-layout">
        <aside class="chat-inbox chat-sidebar" data-chat-inbox sec:authorize="hasRole('ADMIN')">
            <a class="chat-conversation-link" th:each="conversation : ${conversations}"
               th:href="@{/chat/{id}(id=${conversation.customerId()})}"
               th:classappend="${conversation.customerId() == customerId ? ' chat-conversation-active' : ''}">
                <span class="chat-avatar"><i class="fa-regular fa-user"></i></span>
                <span class="chat-conversation-copy">
                    <strong th:text="${conversation.customerName()}"></strong>
                    <span th:text="${conversation.lastMessage()}"></span>
                </span>
                <span class="chat-unread-badge" th:if="${conversation.unreadCount() > 0}"
                      th:text="${conversation.unreadCount() > 99 ? '99+' : conversation.unreadCount()}"></span>
            </a>
        </aside>
        <section class="chat-panel" th:attr="data-customer-id=${customerId}">
            <div class="chat-messages" id="chat-messages" aria-live="polite" aria-label="Nội dung tin nhắn">
                <article class="chat-message" th:each="message : ${messages}"
                         th:classappend="${message.ownMessage() ? ' chat-message-own' : ''}">
                    <strong th:text="${message.senderName()}"></strong>
                    <p th:text="${message.content()}"></p>
                    <time th:text="${message.sentAt()}"></time>
                </article>
                <p class="chat-empty" th:if="${messages.isEmpty()}">Chưa có tin nhắn. Hãy gửi lời chào để bắt đầu.</p>
            </div>
            <p class="chat-status" id="chat-status" role="status" aria-live="polite"></p>
            <form class="chat-compose" id="chat-compose" th:action="@{/chat/messages}" method="post">
                <input type="hidden" name="customerId" th:value="${customerId}" sec:authorize="hasRole('ADMIN')">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <label class="visually-hidden" for="chat-content">Tin nhắn</label>
                <textarea id="chat-content" name="content" rows="2" maxlength="2000"
                          placeholder="Nhập tin nhắn..." required></textarea>
                <button class="button button-dark" type="submit" aria-label="Gửi tin nhắn"><i class="fa-solid fa-paper-plane"></i> Gửi</button>
            </form>
        </section>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/js/chat.js}" defer></script>
<script th:src="@{/js/chat-inbox.js}" defer></script>
</body>
</html>
