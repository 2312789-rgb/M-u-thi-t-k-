<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Đơn hàng')}"></head><body><div th:replace="~{fragments/layout :: header}"></div><main><section class="admin-shell"><aside class="admin-sidebar"><a class="admin-brand" th:href="@{/admin}">MẶC<span> / ADMIN</span></a><a th:href="@{/admin}">Tổng quan</a><a th:href="@{/admin/products}">Sản phẩm</a><a th:href="@{/admin/categories}">Danh mục</a><a class="active" th:href="@{/admin/orders}">Đơn hàng</a><a th:href="@{/admin/customers}">Khách hàng</a></aside><div class="admin-main"><div class="admin-topline"><div><span class="eyebrow">BÁN HÀNG</span><h1>Đơn hàng</h1></div></div><div class="table-wrap admin-table-wrap"><table class="data-table"><thead><tr><th>Mã đơn</th><th>Khách hàng</th><th>Ngày đặt</th><th>Tổng tiền</th><th>Trạng thái</th></tr></thead><tbody><tr th:each="order : ${orders}"><td th:text="${'#MS-' + #numbers.formatInteger(order.id,5)}"></td><td th:text="${order.user.fullName}"></td><td th:text="${#temporals.format(order.orderDate,'dd/MM/yyyy HH:mm')}"></td><td th:text="${#numbers.formatDecimal(order.totalAmount,0,'COMMA',0,'POINT') + ' đ'}"></td><td><form class="status-form" th:action="@{/admin/orders/{id}/status(id=${order.id})}" method="post"><select name="status" th:disabled="${order.status.name() == 'DELIVERED' or order.status.name() == 'CANCELLED'}"><option th:each="status : ${statuses}" th:value="${status}" th:selected="${status == order.status}" th:text="${status.vietnamese()}"></option></select><button th:if="${order.status.name() != 'DELIVERED' and order.status.name() != 'CANCELLED'}" title="Lưu trạng thái"><i class="fa-solid fa-check"></i></button></form></td></tr></tbody></table></div></div></section></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
