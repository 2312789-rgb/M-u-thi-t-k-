<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Danh mục')}"></head><body><div th:replace="~{fragments/layout :: header}"></div><main><section class="admin-shell"><aside class="admin-sidebar"><a class="admin-brand" th:href="@{/admin}">MẶC<span> / ADMIN</span></a><a th:href="@{/admin}">Tổng quan</a><a th:href="@{/admin/products}">Sản phẩm</a><a class="active" th:href="@{/admin/categories}">Danh mục</a><a th:href="@{/admin/orders}">Đơn hàng</a><a th:href="@{/admin/customers}">Khách hàng</a></aside><div class="admin-main"><div class="admin-topline"><div><span class="eyebrow">PHÂN LOẠI</span><h1>Danh mục</h1></div></div><form class="inline-create" th:action="@{/admin/categories/save}" method="post"><input name="name" placeholder="Tên danh mục mới" required maxlength="80"><input name="description" placeholder="Mô tả ngắn" maxlength="500"><button class="button button-dark"><i class="fa-solid fa-plus"></i> Thêm danh mục</button></form><div class="category-admin-list"><form class="category-admin-row" th:each="item : ${categories}" th:action="@{/admin/categories/save}" method="post"><input type="hidden" name="id" th:value="${item.id}"><input name="name" th:value="${item.name}" required maxlength="80"><input name="description" th:value="${item.description}" maxlength="500"><button class="icon-button" title="Lưu"><i class="fa-regular fa-floppy-disk"></i></button><button class="icon-button" th:formaction="@{/admin/categories/{id}/delete(id=${item.id})}" title="Xóa" onclick="return confirm('Xóa danh mục này?')"><i class="fa-regular fa-trash-can"></i></button></form></div></div></section></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
