<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Quản lý sản phẩm')}"></head><body><div th:replace="~{fragments/layout :: header}"></div><main><section class="admin-shell"><aside class="admin-sidebar"><a class="admin-brand" th:href="@{/admin}">MẶC<span> / ADMIN</span></a><a th:href="@{/admin}">Tổng quan</a><a class="active" th:href="@{/admin/products}">Sản phẩm</a><a th:href="@{/admin/categories}">Danh mục</a><a th:href="@{/admin/orders}">Đơn hàng</a><a th:href="@{/admin/customers}">Khách hàng</a></aside><div class="admin-main"><div class="admin-topline"><div><span class="eyebrow">KHO HÀNG</span><h1>Sản phẩm</h1></div><a class="button button-dark" th:href="@{/admin/products/new}"><i class="fa-solid fa-plus"></i> Thêm sản phẩm</a></div><div class="table-wrap admin-table-wrap"><table class="data-table"><thead><tr><th>Sản phẩm</th><th>Danh mục</th><th>Giá</th><th>Tồn kho</th><th>Đã bán</th><th>Trạng thái</th><th></th></tr></thead><tbody><tr th:each="product : ${products}"><td><span class="admin-product"><img th:src="${product.imageUrl}" alt=""><span th:text="${product.name}"></span></span></td><td th:text="${product.category.name}"></td><td th:text="${#numbers.formatDecimal(product.price,0,'COMMA',0,'POINT') + ' đ'}"></td><td th:text="${product.quantity}"></td><td th:text="${product.soldCount}"></td><td><span class="stock-tag" th:classappend="${product.quantity == 0 ? ' stock-out' : product.quantity < 6 ? ' stock-low' : ' stock-ok'}" th:text="${product.quantity == 0 ? 'Hết hàng' : product.quantity < 6 ? 'Sắp hết' : product.status}"></span></td><td class="table-actions"><a th:href="@{/admin/products/{id}/edit(id=${product.id})}" title="Sửa"><i class="fa-regular fa-pen-to-square"></i></a><form th:action="@{/admin/products/{id}/delete(id=${product.id})}" method="post"><button title="Xóa"><i class="fa-regular fa-trash-can"></i></button></form></td></tr></tbody></table></div></div></section></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
