<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Khách hàng')}"></head><body><div th:replace="~{fragments/layout :: header}"></div><main><section class="admin-shell"><aside class="admin-sidebar"><a class="admin-brand" th:href="@{/admin}">MẶC<span> / ADMIN</span></a><a th:href="@{/admin}">Tổng quan</a><a th:href="@{/admin/products}">Sản phẩm</a><a th:href="@{/admin/categories}">Danh mục</a><a th:href="@{/admin/orders}">Đơn hàng</a><a class="active" th:href="@{/admin/customers}">Khách hàng</a></aside><div class="admin-main"><div class="admin-topline"><div><span class="eyebrow">CỘNG ĐỒNG</span><h1>Khách hàng</h1></div></div><div class="table-wrap admin-table-wrap"><table class="data-table"><thead><tr><th>Khách hàng</th><th>Email</th><th>Điện thoại</th><th>Ngày tham gia</th><th></th></tr></thead><tbody><tr th:each="customer : ${customers}"><td th:text="${customer.fullName}"></td><td th:text="${customer.email}"></td><td th:text="${customer.phone}"></td><td th:text="${#temporals.format(customer.createdDate,'dd/MM/yyyy')}"></td><td><a class="text-link" th:href="@{/admin/customers/{id}(id=${customer.id})}">Hồ sơ</a></td></tr></tbody></table></div></div></section></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
