<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Hồ sơ khách hàng')}"></head><body><div th:replace="~{fragments/layout :: header}"></div><main><section class="admin-shell"><aside class="admin-sidebar"><a class="admin-brand" th:href="@{/admin}">MẶC<span> / ADMIN</span></a><a th:href="@{/admin}">Tổng quan</a><a th:href="@{/admin/products}">Sản phẩm</a><a th:href="@{/admin/categories}">Danh mục</a><a th:href="@{/admin/orders}">Đơn hàng</a><a class="active" th:href="@{/admin/customers}">Khách hàng</a></aside><div class="admin-main narrow-admin"><div class="admin-topline"><div><span class="eyebrow">KHÁCH HÀNG</span><h1 th:text="${customer.fullName}"></h1></div><a class="text-link" th:href="@{/admin/customers}">← Danh sách</a></div><form class="admin-form" th:action="@{/admin/customers/{id}/save(id=${customer.id})}" method="post"><label>Họ và tên</label><input name="fullName" th:value="${customer.fullName}" required maxlength="100"><label>Email</label><input th:value="${customer.email}" disabled><label>Số điện thoại</label><input name="phone" th:value="${customer.phone}" required maxlength="20"><label>Địa chỉ</label><textarea name="address" rows="3" maxlength="300" th:text="${customer.address}"></textarea><button class="button button-dark">Lưu thông tin</button></form><div class="customer-order-history"><div class="section-heading"><h2>Lịch sử mua hàng</h2></div><p class="fine-print" th:if="${orders.isEmpty()}">Chưa có đơn hàng.</p><div class="table-wrap" th:unless="${orders.isEmpty()}"><table class="data-table"><thead><tr><th>Mã đơn</th><th>Ngày đặt</th><th>Tổng tiền</th><th>Trạng thái</th></tr></thead><tbody><tr th:each="order : ${orders}"><td th:text="${'#MS-' + #numbers.formatInteger(order.id,5)}"></td><td th:text="${#temporals.format(order.orderDate,'dd/MM/yyyy')}"></td><td th:text="${#numbers.formatDecimal(order.totalAmount,0,'COMMA',0,'POINT') + ' đ'}"></td><td th:text="${order.status.vietnamese()}"></td></tr></tbody></table></div><form th:if="${orders.isEmpty()}" th:action="@{/admin/customers/{id}/delete(id=${customer.id})}" method="post" class="delete-customer-form"><button class="text-link">Xóa tài khoản khách hàng</button></form></div></div></section></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
