<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Quản trị')}"></head><body><div th:replace="~{fragments/layout :: header}"></div><main><section class="admin-shell"><aside class="admin-sidebar"><a class="admin-brand" th:href="@{/admin}">MẶC<span> / ADMIN</span></a><a class="active" th:href="@{/admin}"><i class="fa-solid fa-chart-line"></i>Tổng quan</a><a th:href="@{/admin/products}"><i class="fa-solid fa-shirt"></i>Sản phẩm</a><a th:href="@{/admin/categories}"><i class="fa-solid fa-layer-group"></i>Danh mục</a><a th:href="@{/admin/orders}"><i class="fa-solid fa-receipt"></i>Đơn hàng</a><a th:href="@{/admin/customers}"><i class="fa-solid fa-users"></i>Khách hàng</a></aside><div class="admin-main"><div class="admin-topline"><div><span class="eyebrow">TỔNG QUAN CỬA HÀNG</span><h1>Chào ngày mới.</h1></div></div><div class="stat-grid"><article class="stat-card"><span>Sản phẩm</span><b th:text="${productCount}"></b></article><article class="stat-card"><span>Khách hàng</span><b th:text="${customerCount}"></b></article><article class="stat-card"><span>Đơn hàng</span><b th:text="${orderCount}"></b></article><article class="stat-card stat-revenue"><span>Doanh thu đã giao</span><b th:text="${#numbers.formatDecimal(revenue,0,'COMMA',0,'POINT') + ' đ'}"></b></article></div><div class="dashboard-grid"><section class="admin-panel"><div class="panel-heading"><div><span class="eyebrow">HOẠT ĐỘNG</span><h2>Đơn hôm nay & tồn kho</h2></div></div><p><strong th:text="${todayOrders}">0</strong> đơn hôm nay</p><p><strong th:text="${lowStock}">0</strong> sản phẩm còn không quá 5 chiếc</p><p>Doanh thu tuần: <strong th:text="${#numbers.formatDecimal(recentRevenue,0,'COMMA',0,'POINT') + ' đ'}"></strong></p><a class="text-link" th:href="@{/admin/orders}">Xử lý đơn hàng</a></section><section class="admin-panel"><div class="panel-heading"><div><span class="eyebrow">THEO SỐ LƯỢNG</span><h2>Sản phẩm bán chạy</h2></div></div><div class="best-seller" th:each="product : ${bestSellers}"><img th:src="${product.imageUrl}" alt=""><span th:text="${product.name}"></span><b th:text="${product.soldCount}"></b></div></section></div></div></section></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
