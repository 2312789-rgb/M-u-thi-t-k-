<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Tạo tài khoản')}"></head><body><div th:replace="~{fragments/layout :: header}"></div><main><section class="auth-page"><div class="auth-image register-image"></div><div class="auth-panel"><span class="eyebrow">BẮT ĐẦU TỪ ĐÂY</span><h1>Tạo tài khoản</h1><p>Lưu lại những lựa chọn khiến bạn thấy là chính mình.</p><form th:action="@{/account/register}" th:object="${form}" method="post"><div class="validation-summary" th:if="${#fields.hasGlobalErrors()}"><p th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p></div><label>Họ và tên</label><input th:field="*{fullName}" autocomplete="name"><span th:errors="*{fullName}"></span><label>Email</label><input th:field="*{email}" type="email" autocomplete="email"><span th:errors="*{email}"></span><label>Số điện thoại</label><input th:field="*{phone}" autocomplete="tel"><span th:errors="*{phone}"></span><label>Mật khẩu</label><input th:field="*{password}" type="password" autocomplete="new-password"><span th:errors="*{password}"></span><label>Xác nhận mật khẩu</label><input th:field="*{confirmPassword}" type="password" autocomplete="new-password"><span th:errors="*{confirmPassword}"></span><button class="button button-dark button-block">Tạo tài khoản</button></form><div class="auth-switch">Đã có tài khoản? <a th:href="@{/account/login}">Đăng nhập</a></div></div></section></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
