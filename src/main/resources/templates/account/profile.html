<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Thông tin cá nhân')}"></head><body><div th:replace="~{fragments/layout :: header}"></div><main><section class="page-width content-page"><div class="catalog-heading"><div><span class="eyebrow">TÀI KHOẢN CỦA BẠN</span><h1>Thông tin cá nhân</h1></div><a class="text-link" th:href="@{/orders}">Tất cả đơn hàng <i class="fa-solid fa-arrow-right"></i></a></div><div class="profile-layout"><form class="form-panel" th:action="@{/account/profile}" th:object="${form}" method="post"><label>Họ và tên</label><input th:field="*{fullName}"><span th:errors="*{fullName}"></span><label>Số điện thoại</label><input th:field="*{phone}"><span th:errors="*{phone}"></span><label>Địa chỉ mặc định</label><textarea th:field="*{address}" rows="3"></textarea><span th:errors="*{address}"></span><button class="button button-dark">Lưu thông tin</button></form><aside class="recent-orders"><span class="eyebrow">GẦN ĐÂY</span><h2>Đơn hàng mới nhất</h2><p class="fine-print" th:if="${recentOrders.isEmpty()}">Chưa có đơn hàng nào.</p><a th:each="order : ${recentOrders}" th:href="@{/orders/{id}(id=${order.id})}"><span th:text="${'#MS-' + #numbers.formatInteger(order.id, 5)}"></span><b th:text="${order.status.vietnamese()}"></b></a></aside></div></section></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
