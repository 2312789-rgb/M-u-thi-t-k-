<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Sản phẩm')}"></head><body><div th:replace="~{fragments/layout :: header}"></div><main><section class="page-width catalog-page"><div class="catalog-heading"><div><span class="eyebrow">MẶC THEO CÁCH CỦA BẠN</span><h1>Sản phẩm</h1></div><span class="result-count" th:text="${products.size() + ' thiết kế'}">0 thiết kế</span></div>
<form class="filter-bar" th:action="@{/products}" method="get"><label class="filter-search"><i class="fa-solid fa-magnifying-glass"></i><input name="q" th:value="${q}" placeholder="Tên sản phẩm"></label><select name="categoryId"><option value="">Tất cả danh mục</option><option th:each="category : ${categories}" th:value="${category.id}" th:selected="${category.id == categoryId}" th:text="${category.name}"></option></select><select name="size"><option value="">Mọi size</option><option th:each="item : ${ {'S','M','L','XL','One size'} }" th:value="${item}" th:selected="${item == size}" th:text="${item}"></option></select><select name="color"><option value="">Mọi màu</option><option th:each="item : ${ {'Đen','Trắng ngà','Xanh navy','Be'} }" th:value="${item}" th:selected="${item == color}" th:text="${item}"></option></select><input name="minPrice" type="number" min="0" th:value="${minPrice}" placeholder="Giá từ" aria-label="Giá từ"><input name="maxPrice" type="number" min="0" th:value="${maxPrice}" placeholder="Giá đến" aria-label="Giá đến"><select name="sort"><option value="newest" th:selected="${sort == 'newest'}">Mới nhất</option><option value="price-asc" th:selected="${sort == 'price-asc'}">Giá thấp đến cao</option><option value="price-desc" th:selected="${sort == 'price-desc'}">Giá cao đến thấp</option><option value="best-selling" th:selected="${sort == 'best-selling'}">Bán chạy</option></select><button class="button button-dark">Lọc</button></form>
<div th:if="${products.isEmpty()}" class="empty-state"><i class="fa-solid fa-shirt"></i><h2>Chưa tìm thấy sản phẩm</h2><a class="text-link" th:href="@{/products}">Xóa bộ lọc</a></div><div th:unless="${products.isEmpty()}" class="product-grid catalog-grid"><th:block th:each="product : ${products}"><div th:replace="~{fragments/product-card :: card(product=${product})}"></div></th:block></div></section></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
