spring.datasource.url=${STORE_DB_URL:jdbc:sqlserver://localhost;instanceName=SQLEXPRESS;databaseName=ClothingStoreJavaDb;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${STORE_DB_USERNAME:}
spring.datasource.password=${STORE_DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false