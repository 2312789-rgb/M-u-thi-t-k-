spring.application.name=MacStudio
server.port=5128
spring.datasource.url=jdbc:h2:file:./java-version/data/clothingstore-java;MODE=MSSQLServer
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=5MB
spring.thymeleaf.cache=false
store.name=M\u1eb7c Studio
store.upload-dir=uploads
store.admin-email=${STORE_ADMIN_EMAIL:admin@macstudio.vn}
store.admin-password=${STORE_ADMIN_PASSWORD:Admin123!}
store.seed-demo-users=true
